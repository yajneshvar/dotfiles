# =============================================================================
# General
# =============================================================================
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on

# =============================================================================
# Prefix
# =============================================================================
set -g prefix C-z
unbind C-b
bind C-z send-prefix

# =============================================================================
# Alert / Monitoring
# =============================================================================
# Goes silent for N seconds → likely waiting for input (prompt, password, etc.)
setw -g monitor-silence 10

# New output in a background window → yellow label
setw -g monitor-activity on

# Program rang the terminal bell (sudo, ssh, npm publish prompts, etc.)
setw -g monitor-bell on

# visual "both" = status bar message + outer terminal bell → OS notification
set -g visual-activity  on
set -g visual-bell      both
set -g visual-silence   both

# Alert message style and duration
set -g message-style "fg=colour232,bg=colour220,bold"
set -g display-time 3000

# =============================================================================
# Status Bar
# =============================================================================
set -g status on
set -g status-interval 2
set -g status-position bottom
set -g status-justify left
set -g status-style "fg=colour250,bg=colour235"

set -g status-left-length 30
set -g status-left "#[fg=colour232,bg=colour39,bold] #S #[default] "

set -g status-right-length 50
set -g status-right "#[fg=colour246]%Y-%m-%d  %H:%M "

# Window label colours by state:
#   default   = inactive
#   current   = active window        (blue)
#   activity  = new output           (yellow — running)
#   bell      = bell received        (red — needs attention)
#   silence   = went quiet           (orange — possibly waiting for input)
setw -g window-status-style          "fg=colour246,bg=colour235"
setw -g window-status-current-style  "fg=colour232,bg=colour39,bold"
setw -g window-status-activity-style "fg=colour232,bg=colour220,bold"
setw -g window-status-bell-style     "fg=colour255,bg=colour160,bold"
setw -g window-status-silence-style  "fg=colour232,bg=colour208,bold"

setw -g window-status-format         " #I:#W#F "
setw -g window-status-current-format " #I:#W#F "

# =============================================================================
# Pane Borders
# =============================================================================
set -g pane-border-style        "fg=colour238"
set -g pane-active-border-style "fg=colour39"
set -g display-panes-time 1500

# =============================================================================
# Splits
# =============================================================================
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# =============================================================================
# Navigation
# =============================================================================

# Alt+number — jump directly to window N
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-n next-window
bind -n M-p previous-window
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style, requires prefix)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# =============================================================================
# Layouts — visualize multiple commands at once
# =============================================================================
bind M-t select-layout tiled           # tile all panes evenly
bind M-e select-layout even-horizontal # side by side
bind M-v select-layout even-vertical   # stacked
bind M-m select-layout main-vertical   # one large + column of small panes

# =============================================================================
# Session / Window Overview
# =============================================================================
bind w choose-tree -Zw      # visual tree of all sessions + windows
bind s choose-session -Z    # session picker

# =============================================================================
# Monitoring Toggles
# =============================================================================

# <prefix> m s — toggle silence monitor on current window
bind m-s if-shell "[ $(tmux showw -v monitor-silence) -eq 0 ]" \
  "setw monitor-silence 10; display 'Silence monitor ON (10s)'" \
  "setw monitor-silence 0;  display 'Silence monitor OFF'"

# <prefix> m a — toggle activity monitor on current window
bind m-a if-shell "tmux showw -v monitor-activity | grep -q off" \
  "setw monitor-activity on;  display 'Activity monitor ON'" \
  "setw monitor-activity off; display 'Activity monitor OFF'"

# =============================================================================
# Copy Mode
# =============================================================================
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v                 send -X begin-selection
bind -T copy-mode-vi C-v               send -X rectangle-toggle
bind -T copy-mode-vi C-j               send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter             send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'pbcopy'

# =============================================================================
# Misc
# =============================================================================
set -g mouse on
bind r source-file ~/.tmux.conf \; display "Config reloaded"
